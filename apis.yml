aid: oscar
name: Oscar
description: >-
  Oscar Health (NYSE: OSCR) is a technology-driven health insurance company
  founded in 2012 and headquartered in New York City. It offers individual and
  family health plans, small-business and ICHRA employer benefits, and Medicare
  Advantage in a growing set of U.S. states, pairing coverage with a consumer
  mobile app, 24/7 virtual urgent care, telemedicine, primary care, and
  concierge Care Teams. Oscar's +Oscar division licenses its full-stack
  technology platform (Campaign Builder and other tools) to other payers and
  providers. The company is NCQA-accredited across Health Plan, Utilization
  Management, Credentialing, Provider Network, and Health Equity programs. Oscar
  is a General Catalyst portfolio company. As a CMS-regulated payer it is
  subject to the Interoperability and Patient Access rule, though it does not
  currently publish an open, self-serve developer API portal.
